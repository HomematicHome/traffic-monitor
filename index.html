<!DOCTYPE html>
<html>
<head>
<title>Traffic Monitor Völklingen</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<h1>Traffic Monitor Völklingen</h1>

<div id="stats"></div>

<canvas id="chart"></canvas>

<script>

fetch("traffic.json")
.then(r => r.json())
.then(data => {

document.getElementById("stats").innerHTML =
"Autos heute: " + data.cars +
"<br>Durchschnitt Lärm: " + data.avg_noise + " dB";

new Chart(
document.getElementById("chart"),
{
type: "line",
data: {
labels: data.hours,
datasets: [{
label: "Autos pro Stunde",
data: data.hourly
}]
}
});

});

</script>
<hr>

<p style="font-size:12px; color:gray;">
Diese Seite zeigt anonymisierte Verkehrsdaten einer privaten Messstation.<br>
Es werden keine Audioaufnahmen gespeichert und keine personenbezogenen Daten erhoben.
</p>
</body>
</html>
